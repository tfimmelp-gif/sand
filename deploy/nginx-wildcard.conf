# Use this only for subdomains owned by the platform, for example:
# customer-a.yourplatform.com and customer-b.yourplatform.com.
# Arbitrary user-owned domains should use Caddy On-Demand TLS instead.

server {
    listen 443 ssl http2;
    server_name *.yourplatform.com;

    ssl_certificate /etc/letsencrypt/live/yourplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourplatform.com/privkey.pem;

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
